<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --pin: #2563eb; }
  html, body, #map { height: 100%; margin: 0; }
  body { background: #e8ebef; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .pin { background: none; border: none; }
  .pin svg { display: block; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.4)); }
  .pop b { font-size: 15px; }
  .pop div { color: #555; margin-top: 2px; }
</style>
</head>
<body>
<div id="map"></div>
<script>
// ===== Settings =====
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbydnT4CDPnsEf2rCL-AiQ-DLCSaE_ltiR1q7K77G9hHb7SHwk4LoT7Ef_YTQLDRwlYt/exec";
const REFRESH_SECONDS = 60;
// ====================

const INDIA = [[6.5, 68.1], [35.7, 97.4]];

const map = L.map("map", { minZoom: 3, maxZoom: 19 }).fitBounds(INDIA);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap contributors | Border &copy; BharAtlas (LGD)"
}).addTo(map);

fetch("india_boundary.min.geojson")
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(data => L.geoJSON(data, { interactive: false,
    style: { color: "#333", weight: 1.2, opacity: 0.7, fillOpacity: 0 } }).addTo(map))
  .catch(() => {});

const pins = L.featureGroup().addTo(map);
const PIN_COLOR = getComputedStyle(document.documentElement).getPropertyValue("--pin").trim();
let accCircle = null;

// Teardrop pin icon (SVG), tip anchored at the exact location.
const PIN_ICON = L.divIcon({
  className: "pin",
  html: '<svg width="24" height="36" viewBox="0 0 24 36" aria-hidden="true">' +
        '<path d="M12 1C5.9 1 1 5.9 1 12c0 8.3 11 23 11 23s11-14.7 11-23C23 5.9 18.1 1 12 1z" ' +
        'fill="' + PIN_COLOR + '" stroke="#fff" stroke-width="2"/>' +
        '<circle cx="12" cy="12" r="4" fill="#fff"/></svg>',
  iconSize: [24, 36], iconAnchor: [12, 35], popupAnchor: [0, -32]
});

// Build popup with textContent so names can never inject HTML.
function popup(p) {
  const el = document.createElement("div");
  el.className = "pop";
  const add = (tag, text) => { const n = document.createElement(tag); n.textContent = text; el.appendChild(n); };
  add("b", p.name || "Anonymous");
  add("div", "Lat: " + p.lat.toFixed(6));
  add("div", "Lon: " + p.lng.toFixed(6));
  add("div", "Accuracy: " + (p.source === "manual" ? "placed by hand on map" : p.acc + " meters"));
  add("div", "Time: " + (p.time || "–"));
  return el;
}

// On failure the current pins stay on the map and the next refresh tries again.
async function load() {
  try {
    const r = await fetch(SCRIPT_URL + "?action=list&t=" + Date.now());
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "Couldn't load pins");
    pins.clearLayers();
    for (const p of j.points) {
      const m = L.marker([p.lat, p.lng], {
        icon: PIN_ICON, title: p.name || "Anonymous", riseOnHover: true
      }).bindPopup(popup(p));
      m.on("popupopen", () => {
        if (p.source === "gps" && p.acc > 0) {
          accCircle = L.circle([p.lat, p.lng], { radius: p.acc, color: PIN_COLOR, weight: 1, fillOpacity: 0.08, interactive: false }).addTo(map);
        }
      });
      m.on("popupclose", () => { if (accCircle) { map.removeLayer(accCircle); accCircle = null; } });
      pins.addLayer(m);
    }
  } catch (e) {
    console.warn("Couldn't load pins, retrying in " + REFRESH_SECONDS + " s.", e);
  }
}

load();
setInterval(load, REFRESH_SECONDS * 1000);
</script>
</body>
</html>
